name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        working-directory: apps/mobile
        run: flutter create --platforms=android --org com.familyroots .

      - name: Install Flutter packages
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8000' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: familyroots-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
